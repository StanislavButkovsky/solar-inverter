; Прошивка модуля мониторинга: DALY BMS по BLE + веб-интерфейс в локальной сети
; Сборка:  pio run
; Заливка: pio run -t upload
; Монитор: pio device monitor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; min_spiffs: 1.9 МБ под приложение и два слота OTA.
; NimBLE + Wi-Fi + веб-сервер в дефолтные 1.2 МБ не влезают.
board_build.partitions = min_spiffs.csv

; Страница собирается из web/index.html перед компиляцией
extra_scripts = pre:scripts/gen_web.py

lib_deps =
    ; 2.x обязательна: ядро Arduino здесь 3.3.11 (IDF 5.5), а NimBLE 1.4.x
    ; собрана под IDF 4.4 и падает на esp_bt_controller_init с INVALID_STATE.
    h2zero/NimBLE-Arduino @ ^2.2.3

build_flags =
    ; Логи ядра выключены: они тянут в прошивку все свои строки формата.
    ; Свои сообщения печатаем через Serial и от этого не зависим.
    -DCORE_DEBUG_LEVEL=0

    ; Нужна только роль центрального — модуль сам ходит к батарее. Настройка
    ; сети идёт через точку доступа, рекламировать себя незачем, поэтому
    ; периферийная роль и вещание выключены: это заметный кусок флеша.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; Два постоянных соединения: батарея и донгл инвертора.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

    ; Текстовые расшифровки кодов NimBLE — это таблицы строк на десятки
    ; килобайт, которые нужны только при отладке самого стека.
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=0
    -DCONFIG_NIMBLE_CPP_ENABLE_GAP_EVENT_CODE_TEXT=0
    -DCONFIG_NIMBLE_CPP_ENABLE_ADVERTISEMENT_TYPE_TEXT=0


; Второе устройство: Hiden Control HS35-5648PRO (он же MUST PV18 Pro).
; Подключение по USB, поэтому обязателен S3 — у обычного ESP32 нет USB-host.
; Прошивка та же, отличаются только транспорт и карта регистров.
[env:esp32s3-hs35]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default_8MB.csv

; Флеш на YD-ESP32-S3 — EON (id 1C 3017). С загрузчиком QIO (по умолчанию
; у этой платы) он не включает QIO («Failed to set QIE bit»), и после этого
; запись и чтение NVS из прошивки теряются без единой ошибки: отчёт разведки
; лежал во флеше, а прошивка его не видела и не могла дописать. С DIO всё
; сохраняется и читается.
board_build.flash_mode = dio
; PSRAM у ESP32-S3-N8R2 — 2 МБ, QSPI. Без BOARD_HAS_PSRAM ядро её даже не
; ищет (getPsramSize() == 0); dio_qspi — флеш DIO, PSRAM четырёхпроводная.
board_build.arduino.memory_type = dio_qspi

extra_scripts = pre:scripts/gen_web.py

; Bluetooth нет совсем: батарея говорит через инвертор, владелец BLE не
; использует. Стек NimBLE только ел бы флеш и память (daly_none.cpp).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Выбор профиля и транспорта: MUST по USB вместо Eybond по Bluetooth
    -DTARGET_HS35=1
    ; Serial — на UART0, то есть на разъём COM платы (там мост CH343 или
    ; CP2102). Нативный USB чипа занят: он хост, в него включён инвертор.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DNO_BLE=1
    -DBOARD_HAS_PSRAM

; Третье устройство: ASTERION PLUS 5.6K (семейство Voltronic Axpert).
; Текстовый протокол вместо Modbus, подключение по USB — оба
; последовательных порта заняты батареей.
[env:esp32s3-asterion]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default_8MB.csv
; Та же плата, что у HS35: флеш EON, только DIO
board_build.flash_mode = dio

extra_scripts = pre:scripts/gen_web.py

; Bluetooth нет совсем: батарея говорит через инвертор, владелец BLE не
; использует. Стек NimBLE только ел бы флеш и память (daly_none.cpp).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Профиль Voltronic вместо Modbus; транспорт USB общий с HS35
    -DTARGET_ASTERION=1
    -DTARGET_HS35=1
    ; Serial на разъём COM, нативный USB — хост, как у HS35
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DNO_BLE=1

; Сборка разведки USB: та же плата, что у HS35, но USB-хостом владеет не опрос,
; а usb_probe.cpp — опознаёт устройство на разъёме, перебирает протоколы и
; пишет отчёт в NVS. Для нового инвертора, про который ничего не известно.
[env:esp32s3-probe]
extends = env:esp32s3-hs35
build_flags =
    ${env:esp32s3-hs35.build_flags}
    -DUSB_PROBE=1
